server {
    listen 194.4.56.226:80;
    server_name quiz.ariesdev.kz;

    location ^~ /.well-known/acme-challenge/ {
        root /srv/quiz/acme;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 194.4.56.226:443 ssl http2;
    server_name quiz.ariesdev.kz;
    ssl_certificate /srv/quiz/tls/fullchain.pem;
    ssl_certificate_key /srv/quiz/tls/key.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    access_log /var/log/nginx/quiz.access.log;
    error_log /var/log/nginx/quiz.error.log;

    location / {
        proxy_pass http://127.0.0.1:8087;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

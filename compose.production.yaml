x-logging: &logging
  driver: json-file
  options:
    max-size: 10m
    max-file: '3'

services:
  nginx:
    image: ghcr.io/sqweez/quiz-scoreboard-nginx:${IMAGE_TAG:?Set IMAGE_TAG}
    ports:
      - '127.0.0.1:8087:8080'
    depends_on:
      app:
        condition: service_healthy
    restart: unless-stopped
    mem_limit: 64m
    logging: *logging

  app:
    image: ghcr.io/sqweez/quiz-scoreboard-app:${IMAGE_TAG:?Set IMAGE_TAG}
    env_file: ${APP_ENV_FILE:?Set APP_ENV_FILE}
    environment:
      APP_ENV: production
      APP_DEBUG: 'false'
      DB_CONNECTION: pgsql
      DB_URL: ''
      DB_HOST: postgres
      DB_PORT: '5432'
      SESSION_DRIVER: database
      CACHE_STORE: file
      QUEUE_CONNECTION: sync
      LOG_CHANNEL: stderr
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped
    mem_limit: 512m
    logging: *logging

  postgres:
    image: postgres:17-bookworm@sha256:40865bc877a289da75963d97d72b59633f639fc5af7a4e856bfa3714cae5b536
    environment:
      POSTGRES_DB: ${DB_DATABASE:?Set DB_DATABASE}
      POSTGRES_USER: ${DB_USERNAME:?Set DB_USERNAME}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -U "$$POSTGRES_USER" -d "$$POSTGRES_DB"']
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped
    mem_limit: 384m
    logging: *logging

networks:
  default:
    ipam:
      config:
        - subnet: 172.30.87.0/24
          gateway: 172.30.87.1

volumes:
  postgres_data:

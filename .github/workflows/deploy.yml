name: Test and deploy quiz

on:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: quiz-production
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:17-bookworm@sha256:40865bc877a289da75963d97d72b59633f639fc5af7a4e856bfa3714cae5b536
        env:
          POSTGRES_USER: quiz
          POSTGRES_PASSWORD: quiz
          POSTGRES_DB: quiz_test
        ports: ['55439:5432']
        options: --health-cmd pg_isready --health-interval 5s --health-timeout 3s --health-retries 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
          cache: npm
      - uses: shivammathur/setup-php@d52fc211a0436f8839a587b3b5b8efddab4744ea # v2
        with:
          php-version: '8.4'
          extensions: pdo_pgsql, mbstring
          coverage: none
      - run: npm ci
      - run: npm test
      - run: npm run build
      - run: composer install --prefer-dist --no-interaction
      - name: Run backend tests
        run: |
          cp .env.example .env
          php artisan test

  build:
    needs: test
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        target: [app, nginx]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          target: ${{ matrix.target }}
          platforms: linux/amd64
          push: true
          tags: ghcr.io/sqweez/quiz-scoreboard-${{ matrix.target }}:${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.target }}
          cache-to: type=gha,scope=${{ matrix.target }},mode=max

  deploy:
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: read
    environment:
      name: production
      url: https://quiz.ariesdev.kz
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Deploy over SSH
        env:
          SSH_KEY: ${{ secrets.SSH_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.SSH_KNOWN_HOSTS }}
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_USER: ${{ secrets.SSH_USER }}
          REGISTRY_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REGISTRY_USER: ${{ github.actor }}
          RELEASE_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          umask 077
          mkdir -p ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/quiz
          printf '%s\n' "$SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts
          bundle=$(mktemp -d)
          trap 'rm -rf "$bundle" ~/.ssh/quiz' EXIT
          cp compose.production.yaml "$bundle/"
          printf '%s' "$REGISTRY_USER" > "$bundle/registry-user"
          printf '%s' "$REGISTRY_TOKEN" > "$bundle/registry-token"
          tar -czf - -C "$bundle" compose.production.yaml registry-user registry-token |
            ssh -i ~/.ssh/quiz -o BatchMode=yes -o StrictHostKeyChecking=yes \
              "$SSH_USER@$SSH_HOST" "deploy $RELEASE_SHA"
      - name: Check public HTTPS endpoint
        run: curl --fail --silent --show-error --retry 5 --retry-delay 3 https://quiz.ariesdev.kz/api/health
